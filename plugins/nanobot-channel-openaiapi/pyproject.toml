[project]
name = "nanobot-channel-openaiapi"
version = "0.1.0"
description = "OpenAI-compatible API channel plugin for nanobot"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.1.5",
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn>=0.42.0,<1.0.0",
]

# Discovery is via the in-tree manifest nanobot/channels/openaiapi/manifest.py
# (upstream 462a0dfb retired the "nanobot.channels" entry-point group).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_channel_openaiapi"]
