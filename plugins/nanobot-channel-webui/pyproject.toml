[project]
name = "nanobot-channel-webui"
version = "0.1.0"
description = "Web UI channel plugin for nanobot"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.1.5",
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn>=0.42.0,<1.0.0",
]

[project.entry-points."nanobot.channels"]
webui = "nanobot_channel_webui:WebUIChannel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_channel_webui"]

[tool.hatch.build.targets.wheel.force-include]
"nanobot_channel_webui/resources/webui.html" = "nanobot_channel_webui/resources/webui.html"
