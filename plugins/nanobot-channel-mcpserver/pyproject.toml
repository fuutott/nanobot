[project]
name = "nanobot-channel-mcpserver"
version = "0.1.0"
description = "MCP Streamable HTTP channel plugin for nanobot"
requires-python = ">=3.11"
dependencies = [
    "nanobot-ai>=0.1.5",
    "fastapi>=0.135.0,<1.0.0",
    "uvicorn>=0.42.0,<1.0.0",
]

[project.entry-points."nanobot.channels"]
mcpserver = "nanobot_channel_mcpserver:MCPServerChannel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_channel_mcpserver"]
