x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  volumes:
    - ~/.nanobot:/home/nanobottie/.nanobot
    - ~/.nanobot/oauth-cli-kit:/home/nanobottie/.local/share/oauth-cli-kit
  cap_drop:
    - ALL
  # Fork: SYS_ADMIN + unconfined apparmor/seccomp are required for the
  # bubblewrap exec sandbox. Upstream hardened its default compose (CHOWN/SETGID/
  # SETUID caps + no-new-privileges:true for its root-start entrypoint that
  # chowns bind mounts then drops to the nanobot user). That model is
  # incompatible with bwrap (no-new-privileges blocks the sandbox), and our fork
  # runs as nanobottie via direct USER (already non-root), so we keep the
  # sandbox-friendly caps instead.
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      # Fork: expose gateway + plugin channel ports on all interfaces for
      # LAN/Tailscale access. 8765 serves upstream's gateway WebUI (websocket
      # channel); 18791 openaiapi, 18793 mcpserver. Upstream binds 127.0.0.1 only.
      # (18792 dropped with the retired fork webui plugin.)
      - 18790:18790
      - 18791:18791
      - 18793:18793
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobottie/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
