x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NANOBOT_CHANNELS: ${NANOBOT_CHANNELS:-whatsapp}
  environment:
    NANOBOT_DOCKER_BOOTSTRAP: "1"
    NANOBOT_WEB_TOKEN: ${NANOBOT_WEB_TOKEN:-}
    NANOBOT_API_KEY: ${NANOBOT_API_KEY:-}
  volumes:
    - ~/.nanobot:/home/nanobottie/.nanobot
    - ~/.nanobot/oauth-cli-kit:/home/nanobottie/.local/share/oauth-cli-kit
  cap_drop:
    - ALL
  # Fork: SYS_ADMIN is required for the bubblewrap exec sandbox (Docker's
  # seccomp profile only allows unshare/clone namespaces/mount/setns with it).
  # bwrap also needs pivot_root, which Docker's default profile denies even
  # with SYS_ADMIN, so seccomp-bwrap.json = moby's default profile (docker-
  # v29.9.2, moby/profiles v0.2.4) plus one rule: pivot_root when the container
  # has CAP_SYS_ADMIN. Seccomp stays on. no-new-privileges does not block the
  # non-setuid Debian bwrap, so it is back on too. No apparmor line: Docker
  # Desktop/WSL2 has no AppArmor (on an AppArmor Linux host, docker-default
  # denies mount: add apparmor=unconfined back there). Tested 2026-11-02 on
  # Docker Desktop 4.97 / engine 29.9.2.
  # Runs as nanobottie via USER (non-root), unlike upstream's root-start
  # entrypoint with CHOWN/SETGID/SETUID.
  cap_add:
    - SYS_ADMIN
  security_opt:
    - seccomp=./seccomp-bwrap.json
    - no-new-privileges:true
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      # Fork: expose gateway + plugin channel ports on all interfaces for
      # LAN/Tailscale access. 8765 serves upstream's gateway WebUI (websocket
      # channel); 18791 openaiapi, 18793 mcpserver. Upstream binds 127.0.0.1 only.
      # (18792 dropped with the retired fork webui plugin.)
      - 18790:18790
      - 18791:18791
      - 18793:18793
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobottie/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
