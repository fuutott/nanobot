x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ~/.nanobot:/home/nanobottie/.nanobot
    - ~/.nanobot/oauth-cli-kit:/home/nanobottie/.local/share/oauth-cli-kit
  cap_drop:
    - ALL
  # Fork: SYS_ADMIN + unconfined apparmor/seccomp are required for the
  # bubblewrap exec sandbox. Upstream's b76d54aa hardened its default compose by
  # dropping these; we keep them because our deployment uses the sandbox.
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "3"

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      # Fork: expose all plugin channel ports on all interfaces — the WebUI
      # (18792) and other plugins are reached over LAN/Tailscale (see the
      # user's webui allowedOrigins). Upstream now binds 127.0.0.1:18790 only.
      - 18790:18790
      - 18791:18791
      - 18792:18792
      - 18793:18793
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-api:
    container_name: nanobot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/nanobottie/.nanobot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
