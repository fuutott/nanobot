services:
  nanobot-gateway:
    container_name: nanobot-gateway
    build:
      context: .
      dockerfile: Dockerfile
    image: nanobot
    command: ["gateway"]
    restart: unless-stopped
    # bwrap exec sandbox: see the comment in docker-compose.yml.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=./seccomp-bwrap.json
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "18790:18790"   # gateway health
      - "18791:18791"   # openaiapi plugin
      - "18793:18793"   # mcpserver plugin
      - "8765:8765"     # websocket channel — serves upstream's gateway WebUI
    volumes:
      - ${USERPROFILE}/.nanobot:/home/nanobottie/.nanobot
      - ${USERPROFILE}/.nanobot/oauth-cli-kit:/home/nanobottie/.local/share/oauth-cli-kit
