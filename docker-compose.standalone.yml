services:
  nanobot-gateway:
    container_name: nanobot-gateway
    build:
      context: .
      dockerfile: Dockerfile
    image: nanobot
    command: ["gateway"]
    restart: unless-stopped
    environment:
      # Debug: dump every outgoing LLM request to a JSON file in the workspace
      # under _llm_dumps/. Set to "0" (or remove) to disable.
      NANOBOT_DUMP_LLM_CALLS: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "18790:18790"
      - "18791:18791"
      - "18792:18792"
      - "18793:18793"
    volumes:
      - ${USERPROFILE}/.nanobot:/home/nanobottie/.nanobot
      - ${USERPROFILE}/.nanobot/oauth-cli-kit:/home/nanobottie/.local/share/oauth-cli-kit
